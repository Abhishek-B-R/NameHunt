# this docker compose file is used for development

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    sysctls:
      vm.overcommit_memory: "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "8080"
      NODE_ENV: production
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    shm_size: "1g"
    security_opt:
      - seccomp=unconfined